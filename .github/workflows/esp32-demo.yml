# ESP32 demo web UI (GitHub Pages)

name: esp32-demo

# yamllint disable-line rule:truthy -- `on:` must stay quoted: unquoted it
# parses as boolean True and GitHub ignores the trigger block.
"on":
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'assets/wasm/**'
      - 'demo/system/**'
      - 'configs/wasmc6_defconfig'
      - 'configs/Kconfig'
      - 'mk/**'
      - 'Makefile'
      - 'run_*.js'
      - 'tools/cdp_boot_test.py'
      - 'tools/dev-server.py'
      - '.github/workflows/esp32-demo.yml'
  workflow_dispatch:

concurrency:
  group: esp32-demo-${{ github.ref }}
  cancel-in-progress: false  # don't cancel deploys; partial Pages publishes are worse

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Cache emsdk toolchain
        # The 2.1 GB toolchain download was ~half the old deploy time.
        # Fixed key: bump the version string to bust. `install` below is
        # a fast no-op on a cache hit, so no cache-hit conditional needed.
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-6.0.6
      - name: Install emsdk
        run: |
          if [ ! -d emsdk ]; then git clone --depth 1 https://github.com/emscripten-core/emsdk; fi
          cd emsdk
          ./emsdk install 6.0.6
          ./emsdk activate 6.0.6
          source ./emsdk_env.sh
          # Propagate emsdk env to subsequent steps (each `run:` is a fresh
          # shell). PATH alone is not enough: emcc needs EMSDK/EM_CONFIG to
          # find its .emscripten config and EMSDK_NODE for its bundled node
          # without relying on relative-path auto-discovery.
          # Only propagate values that are set and non-empty: writing them
          # empty to $GITHUB_ENV would override emcc's $HOME/.emscripten
          # fallback with "".
          for var in EMSDK EM_CONFIG EMSDK_NODE EMSDK_PYTHON; do
            val="${!var}"
            [ -n "$val" ] && printf '%s=%s\n' "$var" "$val" >> "$GITHUB_ENV"
          done
          {
            echo "$PWD"
            echo "$PWD/upstream/emscripten"
          } >> $GITHUB_PATH
        shell: bash
      - name: Build ESP32 WASM bundle
        # No network beyond emsdk/xterm CDN: the ESP build no longer
        # depends on the `artifact` target (committed flash images boot
        # directly; old Linux/ELF payloads are gone from the page).
        run: |
          rm -rf build/softfloat build/devices  # objects are toolchain-specific
          make CC=emcc wasmc6_defconfig
          make CC=emcc -j$(nproc)
          ls -la build/rv32emu.js build/rv32emu.wasm
      - name: Gate headless (node, P4 SMP hello)
        # The guest idles after boot, so `timeout` exits 124 by design;
        # the gate is the grepped log, not the exit code.
        # run_p4.js defaults to unicore `-C esp32p4`; the SMP image needs
        # the explicit `-C esp32p4smp` third arg (unicore stalls at entry).
        # 150 s is plenty: local runs print HELLO in ~60 s.
        run: |
          timeout 150 node run_p4.js demo/system/esp32p4smp/p4hellov3.ino.merged.bin "-C esp32p4smp -F /merged.bin" > /tmp/esp_gate.log 2>&1 || true
          grep -a "HELLO_UART_OK" /tmp/esp_gate.log
      - name: Gate headless (node, C6 demotest)
        # Local runs print DEMO_DONE in ~40 s.
        run: |
          timeout 120 node run_c6.js demo/system/esp32c6/demotest.ino.merged.bin > /tmp/esp_gate_c6.log 2>&1 || true
          grep -a "DEMO_DONE" /tmp/esp_gate_c6.log
      - name: Stage ESP web UI
        # prepare-web copies the bundle + HTML + xterm, but also the stale
        # Linux payload (Image/rootfs.cpio, 34 MB) and every committed
        # *.elf (40 MB) — neither is served by the ESP-only page (flash
        # .merged.bin only). Strip them so the Pages artifact stays lean.
        run: |
          make CC=emcc prepare-web
          rm -f demo/system/Image demo/system/rootfs.cpio
          rm -f demo/system/esp32*/*.elf demo/system/i2sgdma/*.elf
          ls -la demo/system demo/system/esp32c6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo/system

  deploy:
    needs: build-and-gate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

