<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 emulator — RISC-V SoC console</title>
  <link rel="preload" href="rv32emu.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="stylesheet" href="xterm.min.css">
  <script defer src="xterm.min.js"></script>
  <style>
    :root {
      --ink: #0b0e14;
      --panel: #12161f;
      --line: #232a38;
      --paper: #e8e4d8;
      --dim: #8b93a5;
      --amber: #e8a33d;
      --teal: #45c4b0;
      --red: #e5484d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--ink);
      color: var(--paper);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 14px;
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--line);
      border-top-color: var(--amber);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { margin-top: 16px; font-size: 16px; color: var(--paper); }
    .loading-progress { width: 220px; height: 4px; background: var(--line); border-radius: 2px; margin-top: 12px; overflow: hidden; }
    .loading-progress-bar { height: 100%; background: var(--amber); width: 100%; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
    .loading-details { margin-top: 8px; font-size: 12px; color: var(--dim); }

    /* Header */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    .brand small { display: block; font-size: 12px; font-weight: 400; color: var(--dim); }

    .top-right { display: flex; align-items: center; gap: 16px; }
    .top-right a { color: var(--dim); text-decoration: none; font-size: 13px; }
    .top-right a:hover { color: var(--amber); }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      color: var(--dim);
      white-space: nowrap;
    }

    .status-pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      flex: none;
    }

    .status-pill.loading::before { background: var(--amber); animation: pulse 1.6s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Layout: firmware rail + console */
    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 20px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 24px 40px;
      align-items: start;
    }

    .rail h2, .console-head h2 {
      font-size: 13px;
      font-weight: 700;
      color: var(--dim);
      margin-bottom: 4px;
    }

    .rail .note { font-size: 12px; color: var(--dim); margin-bottom: 12px; }

    .fw-list { display: flex; flex-direction: column; gap: 10px; }

    .fw-btn {
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--line);
      border-radius: 6px;
      color: var(--paper);
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .fw-btn:hover:not(:disabled) { border-color: var(--amber); border-left-color: var(--amber); }
    .fw-btn:disabled { opacity: 0.45; cursor: default; }
    .fw-btn.active { border-color: var(--teal); border-left-color: var(--teal); background: #151b28; }
    .fw-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

    .fw-chip { font-size: 15px; font-weight: 700; }
    .fw-file { font-size: 12px; color: var(--dim); margin-top: 2px; word-break: break-all; }
    .fw-expect { font-size: 12px; color: var(--teal); margin-top: 2px; }
    .fw-desc { font-size: 12px; color: var(--dim); margin-top: 4px; }

    /* Console */
    .console {
      background: #000;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      min-width: 0;
    }

    .console-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .console-head .hint { font-size: 12px; color: var(--dim); }

    #progress { width: 100%; height: 3px; appearance: none; border: none; background: transparent; display: block; }
    #progress::-webkit-progress-bar { background: transparent; }
    #progress::-webkit-progress-value { background: var(--amber); }

    #terminal { padding: 8px; min-height: 480px; }
    .xterm { padding: 8px; }
    .xterm-viewport { background: #000 !important; }

    .footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 12px;
    }

    .footer a { color: var(--dim); }
    .footer a:hover { color: var(--amber); }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      #terminal { min-height: 320px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation: none; }
      .status-pill.loading::before { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay" role="dialog" aria-modal="true" aria-labelledby="loadingText" aria-describedby="loadingDetails">
    <div class="loading-spinner" aria-hidden="true"></div>
    <div class="loading-text" id="loadingText" role="status" aria-live="polite">Loading emulator…</div>
    <div class="loading-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
      <div class="loading-progress-bar" id="loadingProgressBar"></div>
    </div>
    <div class="loading-details" id="loadingDetails">Fetching rv32emu.wasm</div>
  </div>

  <header class="topbar">
    <div class="brand">ESP32 emulator<small>RISC-V SoC console · C3 · C6 · H2 · P4</small></div>
    <div class="top-right">
      <span class="status-pill loading" id="statusBadge"><span id="statusText">Loading…</span></span>
      <a href="https://github.com/danish9661/esp-rv32-in-C">Source</a>
    </div>
  </header>

  <main class="layout">
    <aside class="rail">
      <h2>Firmware</h2>
      <p class="note">4 MiB flash images, served with this page. Pick one to boot it.</p>
      <div class="fw-list">
        <button class="fw-btn" id="runEsp32c6Button" disabled>
          <div class="fw-chip">ESP32-C6</div>
          <div class="fw-file">esp32c6/demotest.ino.merged.bin</div>
          <div class="fw-expect">Expect: DEMO_DONE</div>
          <div class="fw-desc">GPIO, LEDC, MCPWM, RMT, I2C, SPI, TWAI, sensor, ADC report.</div>
        </button>
        <button class="fw-btn" id="runEsp32h2Button" disabled>
          <div class="fw-chip">ESP32-H2</div>
          <div class="fw-file">esp32h2/h2hello.ino.merged.bin</div>
          <div class="fw-expect">Expect: HELLO_UART_OK, then TICK</div>
          <div class="fw-desc">Hello-world boot through the H2 machine.</div>
        </button>
        <button class="fw-btn" id="runEsp32p4smpButton" disabled>
          <div class="fw-chip">ESP32-P4 dual-core</div>
          <div class="fw-file">esp32p4smp/p4hellov3.ino.merged.bin</div>
          <div class="fw-expect">Expect: HELLO_UART_OK, then TICK</div>
          <div class="fw-desc">Stock dual-core image on the SMP model.</div>
        </button>
        <button class="fw-btn" id="runEsp32p4Button" disabled>
          <div class="fw-chip">ESP32-P4 single-core</div>
          <div class="fw-file">esp32p4/p4hello.ino.patched.bin</div>
          <div class="fw-expect">Expect: HELLO_UART_OK, then TICK</div>
          <div class="fw-desc">Unicore-patched image on the single-hart model.</div>
        </button>
        <button class="fw-btn" id="runEsp32c3Button" disabled>
          <div class="fw-chip">ESP32-C3</div>
          <div class="fw-file">esp32c3/esp32test.ino.merged.bin</div>
          <div class="fw-expect">Expect: entry 0x403cbf10 (silent blink)</div>
          <div class="fw-desc">LED blink, no UART output by design.</div>
        </button>
        <button class="fw-btn" id="runEsp32c6I2SButton" disabled>
          <div class="fw-chip">ESP32-C6 audio DMA</div>
          <div class="fw-file">i2sgdma/i2sgdma.ino.merged.bin</div>
          <div class="fw-expect">Expect: TX_EOF=1</div>
          <div class="fw-desc">I2S receive and transmit through GDMA.</div>
        </button>
      </div>
    </aside>

    <section class="console" aria-label="UART console">
      <div class="console-head">
        <h2>UART console</h2>
        <span class="hint">Typing goes to the guest UART.</span>
      </div>
      <progress value="0" max="100" id="progress" hidden></progress>
      <div id="terminal"></div>
    </section>
  </main>

  <footer class="footer">
    <p>ESP32 emulator — <a href="https://github.com/danish9661/esp-rv32-in-C">source</a>, built on rv32emu</p>
  </footer>

  <script>
    // Loading progress readout
    const ProgressiveLoader = {
      overlay: null, progressBar: null, loadingText: null, loadingDetails: null,
      init() {
        this.overlay = document.getElementById('loadingOverlay');
        this.progressBar = document.getElementById('loadingProgressBar');
        this.loadingText = document.getElementById('loadingText');
        this.loadingDetails = document.getElementById('loadingDetails');
      },
      setProgress(percent, text, details) {
        if (this.progressBar) this.progressBar.style.transform = `scaleX(${percent / 100})`;
        if (text && this.loadingText) this.loadingText.textContent = text;
        if (details && this.loadingDetails) this.loadingDetails.textContent = details;
      },
      formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      },
      hide() { if (this.overlay) this.overlay.classList.add('hidden'); }
    };

    ProgressiveLoader.init();
    ProgressiveLoader.setProgress(5, 'Loading emulator…', 'Fetching rv32emu.wasm');

    let term = null;
    let termInitialized = false;

    function initTerminalWithKeyHandler() {
      if (termInitialized) return;
      if (typeof Terminal === 'undefined') {
        setTimeout(initTerminalWithKeyHandler, 50);
        return;
      }
      term = new Terminal({
        fontFamily: "ui-monospace, Menlo, Consolas, monospace",
        fontSize: 14,
        lineHeight: 1.15,
        theme: {
          background: '#000000',
          foreground: '#e8e4d8',
          cursor: '#e8a33d',
          cursorAccent: '#000000',
          selection: 'rgba(232, 163, 61, 0.3)',
        },
        cursorBlink: true,
        rows: 28,
        cols: 100,
      });
      term.open(document.getElementById('terminal'));
      window.__espTerm = term; // exposed for automated tests
      term.write('ESP32 emulator ready. Pick a firmware on the left to boot.\r\n\r\n');

      if (typeof Module !== 'undefined' && Module._u8250_put_rx_char) {
        term.onKey(({ key }) => {
          for (let i = 0; i < key.length; i++) {
            Module._u8250_put_rx_char(key.charCodeAt(i));
          }
        });
      }
      termInitialized = true;
    }

    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const progressElement = document.getElementById('progress');

    // One entry per bootable firmware. `run` matches system-pre.js
    // (flash path inside MEMFS, no ELF — the SoC boots the image directly).
    const FIRMWARE = [
      { id: 'runEsp32c6Button', chip: 'esp32c6', run: 'run_esp32c6',
        flash: 'esp32c6/demotest.ino.merged.bin', label: 'ESP32-C6' },
      { id: 'runEsp32h2Button', chip: 'esp32h2', run: 'run_esp32h2',
        flash: 'esp32h2/h2hello.ino.merged.bin', label: 'ESP32-H2' },
      { id: 'runEsp32p4smpButton', chip: 'esp32p4smp', run: 'run_esp32p4smp',
        flash: 'esp32p4smp/p4hellov3.ino.merged.bin', label: 'ESP32-P4 SMP' },
      { id: 'runEsp32p4Button', chip: 'esp32p4', run: 'run_esp32p4',
        flash: 'esp32p4/p4hello.ino.patched.bin', label: 'ESP32-P4' },
      { id: 'runEsp32c3Button', chip: 'esp32c3', run: 'run_esp32c3',
        flash: 'esp32c3/esp32test.ino.merged.bin', label: 'ESP32-C3' },
      { id: 'runEsp32c6I2SButton', chip: 'esp32c6', run: 'run_esp32c6',
        flash: 'i2sgdma/i2sgdma.ino.merged.bin', label: 'ESP32-C6 audio DMA' },
    ];

    function setButtonsEnabled(enabled) {
      for (const fw of FIRMWARE) {
        const btn = document.getElementById(fw.id);
        if (btn) btn.disabled = !enabled;
      }
    }

    async function fetchWithProgress(url, label) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Failed to fetch ${url}: ${resp.status}`);
      const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
      const reader = resp.body.getReader();
      const chunks = [];
      let loaded = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        if (total > 0 && term) {
          const pct = ((loaded / total) * 100).toFixed(0);
          term.write(`\r\x1b[K${label}: ${(loaded / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MiB (${pct}%)`);
        }
      }
      if (term) term.write(`\r\x1b[K${label}: done (${(loaded / 1048576).toFixed(1)} MiB)\r\n`);
      const result = new Uint8Array(loaded);
      let offset = 0;
      for (const chunk of chunks) { result.set(chunk, offset); offset += chunk.length; }
      return result;
    }

    async function bootFirmware(fw) {
      const btn = document.getElementById(fw.id);
      // Disable only the clicked button; the emulator runs single-shot per
      // page load, and mass-disabling all six breaks the CDP probe (it
      // polls `disabled === false` before clicking).
      if (btn) { btn.disabled = true; btn.classList.add('active'); }
      statusText.textContent = `Loading ${fw.label}…`;
      statusBadge.classList.add('loading');
      if (term) term.write(`Loading ${fw.label} firmware…\r\n`);
      try {
        const flashData = await fetchWithProgress(fw.flash, 'Flash image');
        try { Module.FS.mkdir('/' + fw.flash.split('/')[0]); } catch (e) { /* already exists */ }
        Module.FS.writeFile('/' + fw.flash, flashData);
        statusText.textContent = `Running ${fw.label}…`;
        statusBadge.classList.remove('loading');
        if (term) term.write(`Booting ${fw.label}…\r\n`);
        Module._indirect_rv_halt();
        Module[fw.run](fw.flash);
      } catch (err) {
        console.error(`${fw.label} boot failed:`, err);
        statusText.textContent = 'Boot failed';
        if (term) term.write(`Error: ${err.message}\r\n`);
        if (btn) { btn.classList.remove('active'); btn.disabled = false; }
      }
    }

    for (const fw of FIRMWARE) {
      document.getElementById(fw.id)?.addEventListener('click', () => bootFirmware(fw));
    }

    const STATUS_REGEX = /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/;

    var Module = {
      instantiateWasm: function(imports, successCallback) {
        const wasmUrl = 'rv32emu.wasm';
        ProgressiveLoader.setProgress(10, 'Loading emulator…', 'Starting download');
        WebAssembly.instantiateStreaming(fetch(wasmUrl), imports)
          .then(result => {
            ProgressiveLoader.setProgress(90, 'Starting…', 'Linking modules');
            successCallback(result.instance, result.module);
          })
          .catch(err => {
            console.warn('Streaming instantiation failed, using fallback:', err.message);
            ProgressiveLoader.setProgress(30, 'Loading…', 'Using fallback method');
            const xhr = new XMLHttpRequest();
            xhr.open('GET', wasmUrl, true);
            xhr.responseType = 'arraybuffer';
            xhr.onprogress = (e) => {
              if (e.lengthComputable) {
                const percent = Math.min(80, 30 + (e.loaded / e.total) * 50);
                ProgressiveLoader.setProgress(percent, 'Loading…',
                  `Got ${ProgressiveLoader.formatBytes(e.loaded)} / ${ProgressiveLoader.formatBytes(e.total)}`);
              }
            };
            xhr.onload = () => {
              if (xhr.status === 200) {
                ProgressiveLoader.setProgress(85, 'Starting…', 'Instantiating module');
                WebAssembly.instantiate(xhr.response, imports)
                  .then(result => {
                    ProgressiveLoader.setProgress(90, 'Starting…', 'Linking modules');
                    successCallback(result.instance, result.module);
                  })
                  .catch(e => {
                    console.error('WASM instantiation failed:', e);
                    ProgressiveLoader.setProgress(0, 'Error', e.message);
                  });
              } else {
                ProgressiveLoader.setProgress(0, 'Error', `HTTP ${xhr.status}`);
              }
            };
            xhr.onerror = () => ProgressiveLoader.setProgress(0, 'Error', 'Network error');
            xhr.send();
          });
        return {};
      },

      print: (function() {
        let printBuffer = [];
        let flushPending = false;
        function flushPrint() {
          if (term && printBuffer.length > 0) {
            const chunk = printBuffer.splice(0, 1000);
            term.write(chunk.join('\r\n') + '\r\n');
            if (printBuffer.length > 0) { requestAnimationFrame(flushPrint); return; }
          }
          flushPending = false;
        }
        return function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
          if (term) {
            printBuffer.push(text);
            if (!flushPending) { flushPending = true; requestAnimationFrame(flushPrint); }
          }
        };
      })(),

      printErr: (function() {
        // Emulator diagnostics stay in the browser console; the terminal
        // shows guest UART output only.
        return function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        };
      })(),

      preRun: [
        function() {
          FS.init(
            null,
            (c) => { if (term) term.write(String.fromCharCode(c)); },
            (c) => { if (term) term.write(String.fromCharCode(c)); }
          );
        }
      ],

      setStatus: (text) => {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        const m = text.match(STATUS_REGEX);
        const now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          statusText.textContent = m[1].trim();
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = false;
        } else {
          progressElement.hidden = true;
          if (text) {
            statusText.textContent = text;
          } else {
            statusText.textContent = 'Ready';
            statusBadge.classList.remove('loading');
            ProgressiveLoader.setProgress(100, 'Ready', 'Emulator initialized');
            setTimeout(() => ProgressiveLoader.hide(), 300);
          }
        }
      },

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        Module.totalDependencies = Math.max(Module.totalDependencies, left);
        Module.setStatus(left
          ? `Loading… (${Module.totalDependencies - left}/${Module.totalDependencies})`
          : 'All downloads complete.');
      },

      onRuntimeInitialized: function() {
        ProgressiveLoader.setProgress(100, 'Ready', 'Runtime initialized');
        initTerminalWithKeyHandler();
        setButtonsEnabled(true);
        setTimeout(() => ProgressiveLoader.hide(), 300);
      }
    };

    Module.setStatus('Downloading…');

    window.onerror = (event) => {
      Module.setStatus('Error - see console');
      if (term) term.write('Error occurred - check browser console\r\n');
      ProgressiveLoader.setProgress(0, 'Error', 'Check console for details');
      Module.setStatus = (text) => { if (text) console.error('[post-exception status] ' + text); };
    };
  </script>
  <script defer type="text/javascript" src="rv32emu.js"></script>
  <script defer src="coi-serviceworker.min.js"></script>
</body>
</html>
